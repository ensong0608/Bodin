<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gallery page.">
  <title>Gallery | Our Story</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=20260213i">
  <script defer src="assets/js/main.js?v=20260213i"></script>
</head>
<body data-page="gallery">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand js-brand" href="index.html">Bodin + You</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation menu">
        <span></span><span></span><span></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="letter.html">Letter</a>
        <a href="songs.html">Songs</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="page-section js-reveal">
      <div class="container section-grid section-grid-flip">
        <div class="section-copy">
          <p class="eyebrow">Captured Moments</p>
          <h1 class="display js-gallery-title">Photo Gallery</h1>
          <p class="lead js-gallery-subtitle">A few memories, one very big love story.</p>
        </div>
        <div class="section-art">
          <img class="illustration small js-float js-parallax" src="assets/images/bodin%26papold-cutout.png" alt="Hand-drawn sketch of you both together">
        </div>
      </div>
    </section>

    <section class="page-section js-reveal">
      <div class="container">
        <section id="galleryGrid" class="gallery-grid" aria-label="Anniversary gallery">
          <figure class="gallery-card js-reveal">
            <button class="gallery-trigger" type="button" aria-label="Open image 1">
              <img src="assets/images/memory-1.svg" alt="Fallback gallery placeholder">
            </button>
            <figcaption>Fallback memory caption.</figcaption>
          </figure>
        </section>
      </div>
    </section>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true" hidden>
      <div class="lightbox-panel" role="document">
        <div class="lightbox-actions">
          <button id="lightboxClose" class="lightbox-control" type="button" aria-label="Close image viewer">Close</button>
          <button id="lightboxPrev" class="lightbox-control" type="button" aria-label="Previous image">Prev</button>
          <button id="lightboxNext" class="lightbox-control" type="button" aria-label="Next image">Next</button>
        </div>
        <figure>
          <img id="lightboxImage" src="assets/images/memory-1.svg" alt="Expanded gallery image">
          <video id="lightboxVideo" controls playsinline hidden aria-label="Expanded gallery video"></video>
          <figcaption id="lightboxCaption">Photo caption</figcaption>
        </figure>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><span class="js-footer-text">Valentine's Day Love</span> - <time class="js-date" datetime="2026-02-14">February 14, 2026</time></p>
      <p class="privacy-note js-privacy-note">Made with love for Bodin.</p>
    </div>
  </footer>
</body>
</html>
